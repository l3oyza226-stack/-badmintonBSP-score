<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>กีฬาสีกลุ่มแบดสัมพันธ์</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Teko:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0c1116;
    --bg-panel:#131a22;
    --bg-panel-2:#1a232d;
    --line:#26313d;
    --red:#e13a3a;
    --red-dim:#3a1c1c;
    --blue:#2f8fe0;
    --blue-dim:#132a3a;
    --gold:#e6b325;
    --text:#eef2f5;
    --text-dim:#8a97a3;
    --court:#0e1a14;
    --court-line: rgba(255,255,255,0.08);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    background-image:
      linear-gradient(var(--court-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--court-line) 1px, transparent 1px);
    background-size: 48px 48px;
    background-attachment: fixed;
  }
  .display{font-family:'Teko',sans-serif; font-weight:600; letter-spacing:0.02em;}
  .mono{font-family:'Space Mono',monospace;}

  /* Top bar */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 24px; border-bottom:1px solid var(--line);
    background:linear-gradient(180deg, rgba(19,26,34,0.95), rgba(12,17,22,0.7));
    position:sticky; top:0; z-index:50; backdrop-filter:blur(6px);
    flex-wrap:wrap; gap:10px;
  }
  .brand{display:flex; align-items:center; gap:10px; cursor:pointer;}
  .brand-logo{width:44px; height:44px; object-fit:contain; display:block;}
  .brand-text{display:flex; flex-direction:column; line-height:1;}
  .brand-title{font-family:'Teko',sans-serif; font-size:26px; font-weight:700; letter-spacing:0.03em; display:flex; flex-direction:column; line-height:1.25; overflow:visible;}
  .brand-title .line1{
    background:linear-gradient(90deg, var(--red), var(--gold) 50%, var(--blue));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    font-size:24px; padding-top:4px; display:inline-block;
  }
  .brand-title .line2{
    background:linear-gradient(90deg, #1a3a8f, var(--blue) 60%, #4fd1e8);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    font-size:17px; font-weight:700; letter-spacing:0.08em; padding-top:2px; display:inline-block;
  }
  .brand-sub{font-size:10px; color:var(--text-dim); letter-spacing:0.15em; text-transform:uppercase;}
  .view-toggle{display:flex; gap:6px; background:var(--bg-panel-2); padding:4px; border-radius:8px; border:1px solid var(--line);}
  .view-toggle button{
    background:transparent; border:none; color:var(--text-dim); padding:7px 16px;
    border-radius:6px; font-size:13px; font-weight:600; cursor:pointer; transition:all .15s;
    font-family:'Inter',sans-serif;
  }
  .view-toggle button.active{background:var(--gold); color:#1a1400;}

  .wrap{max-width:1100px; margin:0 auto; padding:24px 20px 80px;}

  /* ===== PUBLIC VIEW ===== */
  .hero{
    background:radial-gradient(ellipse at 50% -10%, rgba(230,179,37,0.10), transparent 60%), var(--court);
    border:1px solid var(--line); border-radius:14px; padding:28px 24px; margin-bottom:22px;
    position:relative; overflow:hidden;
  }
  .hero::before{
    content:''; position:absolute; left:50%; top:0; bottom:0; width:2px; background:var(--court-line); transform:translateX(-50%);
  }
  .hero-label{
    display:flex; align-items:center; gap:8px; font-size:11px; letter-spacing:0.2em; text-transform:uppercase;
    color:var(--gold); font-weight:700; margin-bottom:14px; justify-content:center;
  }
  .pulse-dot{width:7px;height:7px;border-radius:50%; background:var(--gold); animation:pulse 1.4s infinite;}
  @keyframes pulse{0%,100%{opacity:1; transform:scale(1);} 50%{opacity:.4; transform:scale(0.7);}}

  .live-match{display:grid; grid-template-columns:1fr auto 1fr; gap:14px; align-items:center;}
  .side{text-align:center;}
  .side.red .pair-tag{background:var(--red-dim); color:#ff8080; border:1px solid #5a2323;}
  .side.blue .pair-tag{background:var(--blue-dim); color:#8fc7f5; border:1px solid #1f4763;}
  .pair-tag{display:inline-block; font-size:11px; font-weight:700; letter-spacing:0.1em; padding:3px 10px; border-radius:20px; margin-bottom:10px; text-transform:uppercase;}
  .pair-names{font-size:19px; font-weight:700; line-height:1.3; min-height:50px;}
  .pair-names span{display:block; font-size:15px; font-weight:500; color:var(--text-dim);}
  .live-score{font-family:'Teko',sans-serif; font-size:64px; font-weight:700; line-height:1; margin-top:10px;}
  .side.red .live-score{color:var(--red);}
  .side.blue .live-score{color:var(--blue);}
  .vs-mid{display:flex; flex-direction:column; align-items:center; gap:6px; color:var(--text-dim);}
  .vs-mid .vs-text{font-family:'Teko',sans-serif; font-size:22px; color:#4a5865;}
  .no-live{text-align:center; padding:20px 10px; color:var(--text-dim); font-size:14px;}

  /* Public tabs */
  .public-tabs{display:flex; gap:8px; margin-bottom:16px;}
  .ptab{
    flex:1; background:var(--bg-panel); border:1px solid var(--line); color:var(--text-dim);
    padding:11px 14px; border-radius:10px; font-size:13px; font-weight:700; cursor:pointer;
    font-family:'Inter',sans-serif; letter-spacing:0.02em; transition:all .15s;
  }
  .ptab.active{background:var(--gold); color:#1a1400; border-color:var(--gold);}

  /* Queue ticker */
  .section-title{
    font-family:'Teko',sans-serif; font-size:22px; font-weight:600; letter-spacing:0.03em;
    margin:26px 0 12px; display:flex; align-items:center; gap:10px;
  }
  .section-title::after{content:''; flex:1; height:1px; background:var(--line);}
  .queue-row{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px;}
  .queue-card{
    width:100%; background:var(--bg-panel); border:1px solid var(--line);
    border-radius:10px; padding:12px 14px; position:relative;
    display:block; min-width:0;
  }
  .queue-card .queue-num{margin-bottom:6px; flex-direction:row; align-items:center; gap:2px;}
  .queue-card .queue-teams{display:flex; flex-direction:column; gap:2px; min-width:0; text-align:center;}
  .queue-card .queue-num > span:first-child{font-size:14px; color:var(--gold); font-weight:700; letter-spacing:0.03em;}
  .queue-card.is-live{border-color:var(--gold); box-shadow:0 0 0 1px var(--gold) inset;}
  .queue-num{font-size:10px; color:var(--text-dim); letter-spacing:0.1em; margin-bottom:6px; display:flex; justify-content:space-between;}
  .queue-num .badge-live{color:var(--gold); font-weight:700;}
  .queue-team{font-size:12px; font-weight:600; margin:3px 0;}
  .queue-team.r{color:#ff8080;} .queue-team.b{color:#8fc7f5;}
  .queue-vs{font-size:10px; color:var(--text-dim); margin:0; text-align:center; width:100%;}

  /* Team score tally */
  .tally{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:6px;}
  .tally-card{
    border-radius:12px; padding:18px 20px; text-align:center; border:1px solid var(--line);
  }
  .tally-card.red{background:linear-gradient(160deg, var(--red-dim), var(--bg-panel));}
  .tally-card.blue{background:linear-gradient(160deg, var(--blue-dim), var(--bg-panel));}
  .tally-team{font-size:13px; letter-spacing:0.15em; text-transform:uppercase; font-weight:700; margin-bottom:4px;}
  .tally-card.red .tally-team{color:#ff8080;}
  .tally-card.blue .tally-team{color:#8fc7f5;}
  .tally-num{font-family:'Teko',sans-serif; font-size:56px; font-weight:700; line-height:1;}
  .result-chart{display:grid; grid-template-columns:1fr 1fr; gap:22px; height:142px; margin-bottom:6px;}
  .result-bar-column{display:grid; grid-template-rows:auto 1fr auto; justify-items:center; gap:5px; min-width:0;}
  .result-bar-label{font-size:12px; font-weight:700;}
  .result-bar-label.red{color:#ff8080;} .result-bar-label.blue{color:#8fc7f5;}
  .result-bar-track{width:100%; min-height:0; display:flex; align-items:flex-end; background:var(--bg-panel); border:1px solid var(--line); border-radius:5px; overflow:hidden;}
  .result-bar{width:100%; min-height:18%; border-radius:4px 4px 0 0; display:flex; align-items:flex-start; justify-content:center; padding-top:5px; color:#fff; font:700 12px 'Space Mono',monospace; transition:height .3s ease;}
  .result-bar.red{background:linear-gradient(90deg, #a92d35, var(--red));}
  .result-bar.blue{background:linear-gradient(90deg, #236ca8, var(--blue));}
  .celebration{position:relative; overflow:hidden; min-height:112px; display:flex; align-items:center; justify-content:center; margin:0 0 12px; border:1px solid var(--gold); border-radius:10px; background:radial-gradient(circle at 50% 100%, rgba(230,179,37,0.15), transparent 55%), var(--bg-panel); text-align:center;}
  .celebration-copy{position:relative; z-index:2; color:var(--gold); font-family:'Teko',sans-serif; font-size:25px; font-weight:700;}
  .trophy-mark{position:relative; z-index:2; margin-right:10px; font-size:42px; line-height:1; filter:drop-shadow(0 0 8px rgba(230,179,37,0.8)); animation:trophyGlow 1.8s ease-in-out infinite;}
  @keyframes trophyGlow{50%{transform:scale(1.08); filter:drop-shadow(0 0 16px rgba(230,179,37,1));}}
  .fireworks-overlay{position:fixed; inset:0; z-index:40; pointer-events:none; overflow:hidden;}
  .firework{position:absolute; width:4px; height:4px; border-radius:50%; color:var(--gold); background:currentColor; box-shadow:0 0 0 0 currentColor; animation:firework 2.5s ease-out infinite;}
  .firework.one{left:10%; top:22%;} .firework.two{left:28%; top:44%; animation-delay:.7s; color:var(--blue);}
  .firework.three{left:48%; top:18%; animation-delay:1.3s; color:var(--red);}
  .firework.four{left:68%; top:38%; animation-delay:1.8s; color:#4fd1e8;}
  .firework.five{left:88%; top:20%; animation-delay:2.1s; color:var(--gold);}
  .firework.six{left:18%; top:72%; animation-delay:.35s; color:var(--red);}
  .firework.seven{left:52%; top:66%; animation-delay:1s; color:var(--gold);}
  .firework.eight{left:82%; top:78%; animation-delay:1.65s; color:var(--blue);}
  @keyframes firework{0%,100%{opacity:0; box-shadow:0 0 0 0 currentColor;} 15%{opacity:1;} 65%{opacity:0; box-shadow:0 -42px 0 -1px currentColor, 30px -30px 0 -1px currentColor, 42px 0 0 -1px currentColor, 30px 30px 0 -1px currentColor, 0 42px 0 -1px currentColor, -30px 30px 0 -1px currentColor, -42px 0 0 -1px currentColor, -30px -30px 0 -1px currentColor;}}
  .result-hidden{display:flex; align-items:center; justify-content:center; min-height:82px; margin-bottom:6px; border:2px solid var(--gold); border-radius:8px; background:rgba(230,179,37,0.06); box-shadow:0 0 0 1px rgba(230,179,37,0.12) inset; color:var(--gold); font-size:13px; font-weight:700;}
  .announce-card{display:flex; align-items:center; justify-content:space-between; gap:16px; margin:18px 0 18px;}
  .announce-card p{color:var(--text-dim); font-size:12px; margin-top:4px;}
  .announce-state{font-size:12px; color:var(--gold); white-space:nowrap;}
  .sportsmanship-card{display:flex; align-items:flex-start; justify-content:center; position:sticky; top:78px; z-index:20; min-height:240px; gap:14px; margin:18px 0 22px; padding:16px 18px; border:1px solid rgba(79,209,232,0.35); border-left:4px solid #4fd1e8; border-radius:10px; background:linear-gradient(135deg, rgba(19,26,34,0.98), rgba(14,26,20,0.98)); text-align:center; box-shadow:0 8px 20px rgba(0,0,0,0.28);}
  .sportsmanship-mark{font-size:28px; line-height:1;}
  .sportsmanship-copy{width:100%; min-width:0; min-height:206px; display:flex; flex-direction:column; align-items:center;}
  .sportsmanship-copy h3{font-family:'Teko',sans-serif; font-size:21px; color:#8fe8f5; margin-bottom:4px; text-decoration:underline; text-underline-offset:3px;}
  .sportsmanship-copy p{position:relative; color:var(--text); font-size:34px; font-weight:700; line-height:1.35; white-space:nowrap; overflow:hidden; width:100%; height:46px; margin-top:auto; margin-bottom:auto;}
  .sportsmanship-copy p span.sportsmanship-track{position:absolute; left:0; top:50%; display:inline-block; width:max-content; will-change:transform;}
  .sportsmanship-copy p span.sportsmanship-text{display:inline-block; white-space:nowrap;}
  @keyframes announcementScroll{from{transform:translate(0,-50%);}to{transform:translate(calc(-100% - 100vw),-50%);}}
  .message-editor{display:flex; flex-direction:column; gap:7px; margin-bottom:22px;}
  .message-editor label{font-size:11px; color:var(--text-dim);}
  .message-editor textarea{width:100%; min-height:92px; resize:vertical; background:var(--bg); border:1px solid var(--line); color:var(--text); padding:9px; border-radius:6px; font-size:13px; line-height:1.6; font-family:'Inter',sans-serif;}
  .message-editor textarea:focus{outline:none; border-color:var(--gold);}
  .message-tools{display:flex; justify-content:flex-end; position:relative;}
  .emoji-toggle{display:inline-flex; align-items:center; gap:6px;}
  .emoji-picker{display:flex; flex-wrap:wrap; gap:4px; position:absolute; right:0; bottom:calc(100% + 6px); z-index:5; width:min(280px, 100%); padding:8px; background:var(--bg-panel-2); border:1px solid var(--line); border-radius:8px; box-shadow:0 8px 20px rgba(0,0,0,.3);}
  .emoji-picker[hidden]{display:none;}
  .emoji-choice{width:36px; height:32px; padding:0; border:1px solid transparent; border-radius:5px; background:transparent; color:var(--text); font-size:19px; cursor:pointer;}
  .emoji-choice:hover{background:var(--bg); border-color:var(--gold);}
  @media(max-width:520px){
    .result-chart{height:126px; gap:12px;}
    .result-bar-label{font-size:11px;}
    .announce-card{align-items:flex-start; flex-direction:column;}
    .sportsmanship-card{top:64px; padding:14px 12px; gap:10px;}
    .sportsmanship-copy p{font-size:26px; height:36px;}
    .trophy-mark{font-size:34px;}
  }

  /* Results table */
  .table-wrap{background:var(--bg-panel); border:1px solid var(--line); border-radius:12px; overflow:hidden;}
  table{width:100%; border-collapse:collapse; font-size:13px;}
  thead th{
    text-align:left; padding:10px 12px; background:var(--bg-panel-2); color:var(--text-dim);
    font-size:10px; letter-spacing:0.1em; text-transform:uppercase; font-weight:700;
  }
  tbody td{padding:10px 12px; border-top:1px solid var(--line); vertical-align:middle;}
  tbody tr.live-row{background:rgba(230,179,37,0.06);}
  .status-pill{font-size:10px; font-weight:700; padding:3px 8px; border-radius:20px; letter-spacing:0.05em;}
  .status-pill.upcoming{background:#1f2a33; color:var(--text-dim);}
  .status-pill.live{background:var(--gold); color:#1a1400;}
  .status-pill.finished{background:#1f2a33; color:#7fd88f;}
  .score-cell{font-family:'Space Mono',monospace; font-weight:700;}
  .winner{color:var(--gold);}
  tbody tr.has-winner{background:rgba(230,179,37,0.045);}
  .winner-pill{
    display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:800;
    padding:4px 10px; border-radius:20px; letter-spacing:0.03em;
  }
  .winner-pill::before{content:'🏆'; font-size:10px;}
  .winner-pill.red{background:rgba(225,58,58,0.18); color:#ff8080; border:1px solid rgba(225,58,58,0.5);}
  .winner-pill.blue{background:rgba(47,143,224,0.18); color:#8fc7f5; border:1px solid rgba(47,143,224,0.5);}
  td.team-r{color:#ff8080;} td.team-b{color:#8fc7f5;}

  /* ===== ADMIN VIEW ===== */
  .admin-grid{display:grid; grid-template-columns:1fr 1fr; gap:22px;}
  .card{background:var(--bg-panel); border:1px solid var(--line); border-radius:12px; padding:16px 18px;}
  .card h3{font-family:'Teko',sans-serif; font-size:20px; font-weight:600; margin-bottom:12px; display:flex; align-items:center; gap:8px;}
  .card h3 .dot{width:8px;height:8px;border-radius:50%;}
  .card h3 .dot.r{background:var(--red);} .card h3 .dot.b{background:var(--blue);}
  .pair-row{display:grid; grid-template-columns:26px minmax(0,1fr) minmax(0,1fr) 30px; gap:10px; margin-bottom:10px; align-items:center;}
  .pair-row .idx{font-size:11px; color:var(--text-dim); text-align:center; font-family:'Space Mono',monospace;}
  .del-pair-btn{width:30px; padding:6px 0;}
  input[type=text], select, input[type=number]{
    width:100%; background:var(--bg); border:1px solid var(--line); color:var(--text);
    padding:7px 9px; border-radius:6px; font-size:13px; font-family:'Inter',sans-serif;
  }
  input:focus, select:focus{outline:none; border-color:var(--gold);}
  .match-admin-row{
    display:grid; grid-template-columns:26px 1fr 1fr 58px 58px 100px 30px; gap:6px; align-items:center;
    padding:6px 0; border-bottom:1px solid var(--line);
  }
  .match-admin-row:last-child{border-bottom:none;}
  .match-admin-row .idx{font-size:11px; color:var(--text-dim); font-family:'Space Mono',monospace;}
  .match-admin-header > div{font-size:13px !important; font-weight:700;}
  .match-admin-header .header-red{color:#ff8080;}
  .match-admin-header .header-blue{color:#8fc7f5;}
  .match-admin-header .header-status{color:var(--gold) !important;}
  .btn{
    background:var(--gold); color:#1a1400; border:none; padding:8px 16px; border-radius:7px;
    font-weight:700; font-size:12px; cursor:pointer; letter-spacing:0.03em;
  }
  .btn.secondary{background:var(--bg-panel-2); color:var(--text); border:1px solid var(--line);}
  .btn.small{padding:6px 10px; font-size:11px;}
  .btn:hover{filter:brightness(1.08);}
  .save-bar{
    margin:0 0 12px; background:var(--bg-panel); border:1px solid var(--line);
    border-radius:12px; padding:12px 16px; display:flex; justify-content:space-between; align-items:center;
    box-shadow:0 6px 18px rgba(0,0,0,0.24);
  }
  .save-status{font-size:12px; color:var(--text-dim);}
  .save-status.ready{color:#7fd88f;}
  .full-w{grid-column:1/-1;}
  .status-select{padding:5px 6px; font-size:11px;}
  .empty-hint{color:var(--text-dim); font-size:12px; padding:8px 0;}
  .login-panel{position:fixed; inset:0; z-index:100; display:flex; align-items:center; justify-content:center; padding:16px; background:rgba(0,0,0,0.72);}
  .login-panel[hidden]{display:none;}
  .confirm-panel{position:fixed; inset:0; z-index:100; display:flex; align-items:center; justify-content:center; padding:16px; background:rgba(0,0,0,0.72);}
  .confirm-panel[hidden]{display:none;}
  .login-box{width:min(360px,100%); background:var(--bg-panel); border:1px solid var(--gold); border-radius:10px; padding:20px; box-shadow:0 12px 40px rgba(0,0,0,0.5);}
  .login-box h2{font-family:'Teko',sans-serif; font-size:25px; margin-bottom:14px;}
  .login-box label{display:block; color:var(--text-dim); font-size:11px; margin:10px 0 5px;}
  .login-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:16px;}
  .login-error{color:#ff8080; font-size:11px; min-height:15px; margin-top:8px;}
  @media(max-width:760px){
    .topbar{padding:10px 12px; gap:8px;}
    .brand{gap:7px; min-width:0;}
    .brand-logo{width:36px; height:36px;}
    .brand-title .line1{font-size:20px;}
    .brand-title .line2{font-size:14px;}
    .view-toggle{flex:1; min-width:0;}
    .view-toggle button{flex:1; padding:8px 6px; font-size:11px; white-space:nowrap;}
    .wrap{padding:16px 12px 56px;}
    .hero{padding:20px 12px; margin-bottom:16px; border-radius:10px;}
    .hero-label{font-size:10px; letter-spacing:0.12em; margin-bottom:10px;}
    .live-match{grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); gap:6px;}
    .pair-tag{font-size:10px; padding:3px 7px; margin-bottom:7px;}
    .pair-names{font-size:14px; min-height:42px; overflow-wrap:anywhere;}
    .pair-names span{font-size:12px;}
    .admin-grid{grid-template-columns:1fr;}
    .live-score{font-size:44px;}
    .vs-mid .vs-text{font-size:18px;}
    .public-tabs{gap:5px; margin-bottom:12px;}
    .ptab{padding:9px 6px; border-radius:8px; font-size:11px;}
    .section-title{font-size:19px; margin:20px 0 9px;}
    .queue-card{padding:9px; gap:9px; border-radius:8px;}
    .queue-card .queue-num{min-width:0; font-size:9px;}
    .queue-card .queue-num > span:first-child{font-size:12px;}
    .queue-team{font-size:10px; overflow-wrap:anywhere;}
    .queue-vs{font-size:9px; margin-left:4px;}
    .result-hidden{min-height:68px; font-size:12px;}
    .table-wrap{overflow-x:auto; border-radius:8px;}
    table{min-width:650px; font-size:12px;}
    thead th, tbody td{padding:8px 9px;}
    .results-table-wrap{overflow-x:hidden;}
    .results-table-wrap table{min-width:0; table-layout:fixed; font-size:10px;}
    .results-table-wrap th:nth-child(1), .results-table-wrap td:nth-child(1){width:18%; text-align:center; white-space:nowrap;}
    .results-table-wrap th:nth-child(2), .results-table-wrap td:nth-child(2),
    .results-table-wrap th:nth-child(5), .results-table-wrap td:nth-child(5){width:16%; text-align:left; overflow-wrap:anywhere;}
    .results-table-wrap th:nth-child(3), .results-table-wrap td:nth-child(3),
    .results-table-wrap th:nth-child(4), .results-table-wrap td:nth-child(4){width:8%; text-align:center;}
    .results-table-wrap th:nth-child(6), .results-table-wrap td:nth-child(6){width:17%; text-align:center;}
    .results-table-wrap th:nth-child(7), .results-table-wrap td:nth-child(7){width:17%; text-align:center;}
    .results-table-wrap thead th{padding:6px 3px; font-size:9px;}
    .results-table-wrap tbody td{padding:5px 3px; height:29px;}
    .results-table-wrap .winner-pill{font-size:9px; padding:2px 5px; gap:2px;}
    .results-table-wrap .winner-pill::before{font-size:8px;}
    .results-table-wrap .status-pill{font-size:9px; padding:2px 4px;}
    .card{padding:13px 12px; border-radius:9px;}
    .card h3{font-size:18px; margin-bottom:10px;}
    .pair-row{grid-template-columns:22px minmax(0,1fr) minmax(0,1fr) 26px; gap:6px;}
    .del-pair-btn{width:26px; padding:6px 0;}
    input[type=text], select, input[type=number]{padding:8px 7px; font-size:12px;}
    .card.full-w{overflow:hidden;}
    .match-admin-row{min-width:0; grid-template-columns:18px minmax(0,1fr) minmax(0,1fr) 36px 36px 68px 24px; gap:3px; font-size:10px;}
    .match-admin-row > *{min-width:0;}
    .match-admin-row input, .match-admin-row select{padding:7px 3px; font-size:10px;}
    .match-admin-row .btn.small{padding:6px 3px; font-size:11px;}
    .save-bar{padding:10px 12px; gap:8px;}
    .save-bar .btn{padding:7px 9px; font-size:10px;}
  }
</style>

<script>
const TEAMS = ['red','blue'];
const TEAM_LABEL = {red:'ทีมสีแดง', blue:'ทีมสีฟ้า'};
const STORAGE_KEY = 'badminton-tournament-data';
let state = null;
let saveTimer = null;
let pollTimer = null;
let currentView = 'public';
let publicTab = 'overview';
let pendingDelete = null;
let announcementAnimationFrame = null;
let announcementPosition = null;
let dataLoadError = null;
const firebaseConfig = {
  apiKey: 'AIzaSyDHYacPevPMMvm2v3O_wbnwH7CiWIIO7Ag',
  authDomain: 'badmintonbsp-score.firebaseapp.com',
  projectId: 'badmintonbsp-score',
  storageBucket: 'badmintonbsp-score.firebasestorage.app',
  messagingSenderId: '521337649956',
  appId: '1:521337649956:web:2afcae1b3fdf2f751511b1'
};
let firestore = null;
let firestoreApi = null;
let firebaseAuth = null;
let authApi = null;
let firebaseLoadError = null;
let dataReady = false;
const firebaseReady = Promise.race([
  Promise.all([
  import('https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js'),
  import('https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js'),
  import('https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js')
  ]),
  new Promise((_, reject)=>setTimeout(()=>reject(new Error('Firebase SDK timeout')), 8000))
]).then(([appApi, dbApi, authModule])=>{
  const app = appApi.initializeApp(firebaseConfig);
  firestore = dbApi.getFirestore(app);
  firestoreApi = dbApi;
  firebaseAuth = authModule.getAuth(app);
  authApi = authModule;
}).catch(error=>{ firebaseLoadError = error; });

function defaultState(){
  const pairs = {red:[], blue:[]};
  TEAMS.forEach(t=>{
    for(let i=0;i<8;i++){
      pairs[t].push({p1:'', p2:''});
    }
  });
  const matches = [];
  for(let i=0;i<16;i++){
    matches.push({
      order:i+1,
      redIdx: i % 8,
      blueIdx: i % 8,
      redScore:'', blueScore:'',
      status: i===0 ? 'live' : 'upcoming'
    });
  }
  return {pairs, matches, resultsPublished:false, sportsMessage:'ขอให้นักกีฬาทุกคนเล่นด้วยความตั้งใจ ให้เกียรติคู่แข่ง และส่งกำลังใจให้กัน เพราะมิตรภาพที่ดีงดงามกว่าชัยชนะเสมอ'};
}

const hasCloudStorage = (typeof window.storage !== 'undefined' && window.storage && typeof window.storage.get === 'function');

async function loadState(){
  dataReady = false;
  dataLoadError = null;
  try{
    await firebaseReady;
    if(firestore){
      const ref = firestoreApi.doc(firestore, 'scoreboard', 'current');
      const snapshot = await firestoreApi.getDoc(ref);
      if(snapshot.exists() && snapshot.data().state){
        state = snapshot.data().state;
      } else {
        const raw = localStorage.getItem(STORAGE_KEY);
        state = raw ? JSON.parse(raw) : defaultState();
        dataReady = true;
        await saveState();
      }
    } else if(hasCloudStorage){
      const res = await window.storage.get(STORAGE_KEY, true);
      state = (res && res.value) ? JSON.parse(res.value) : defaultState();
    } else {
      const raw = localStorage.getItem(STORAGE_KEY);
      state = raw ? JSON.parse(raw) : defaultState();
    }
  }catch(e){
    state = defaultState();
    dataLoadError = e;
    return;
  }
  if(typeof state.resultsPublished !== 'boolean') state.resultsPublished = false;
  if(typeof state.sportsMessage !== 'string') state.sportsMessage = defaultState().sportsMessage;
  dataReady = true;
}

function setSaveStatus(text, ready){
  const el = document.getElementById('saveStatus');
  if(!el) return;
  el.textContent = text;
  el.classList.toggle('ready', ready);
}

function isValidScore(value){
  if(value === '') return true;
  const score = Number(value);
  return Number.isInteger(score) && score >= 0 && score <= 30;
}

function validateState(){
  return state.matches.every(match=>isValidScore(match.redScore) && isValidScore(match.blueScore));
}

async function saveState(){
  if(!dataReady){
    setSaveStatus('ยังโหลดข้อมูลไม่สำเร็จ จึงยังบันทึกไม่ได้', false);
    return;
  }
  if(!validateState()){
    setSaveStatus('บันทึกไม่ได้: กรุณาตรวจสอบคะแนนให้เป็นจำนวนเต็ม 0-30', false);
    return;
  }
  try{
    await firebaseReady;
    if(firestore){
      const ref = firestoreApi.doc(firestore, 'scoreboard', 'current');
      await firestoreApi.setDoc(ref, {state, updatedAt: new Date().toISOString()});
    } else if(hasCloudStorage){
      await window.storage.set(STORAGE_KEY, JSON.stringify(state), true);
    } else {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }
    setSaveStatus('บันทึกแล้ว ' + new Date().toLocaleTimeString('th-TH') + (firestore || hasCloudStorage ? '' : ' (เก็บในเครื่องนี้เท่านั้น)'), true);
  }catch(e){
    setSaveStatus('บันทึกไม่สำเร็จ: ' + (e && e.message ? e.message : 'ลองใหม่อีกครั้ง'), false);
  }
}

function scheduleSave(){
  setSaveStatus('กำลังบันทึก...', false);
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveState, 500);
}

function pairName(team, idx){
  const p = state.pairs[team][idx];
  if(!p) return {main:'-', sub:''};
  const p1 = p.p1 ? p.p1.trim() : '';
  const p2 = p.p2 ? p.p2.trim() : '';
  if(!p1 && !p2) return {main:`คู่ ${idx+1}`, sub:''};
  return {main:`${escapeHtml(p1 || '?')} / ${escapeHtml(p2 || '?')}`, sub:`คู่ ${idx+1}`};
}

function matchWinner(m){
  if(m.status !== 'finished') return null;
  if(m.redScore === '' || m.blueScore === '') return null;
  const r = Number(m.redScore), b = Number(m.blueScore);
  if(isNaN(r) || isNaN(b) || r===b) return null;
  return r > b ? 'red' : 'blue';
}

function teamTally(){
  let wins = {red:0, blue:0}, points = {red:0, blue:0};
  state.matches.forEach(m=>{
    if(m.status !== 'finished') return;
    const w = matchWinner(m);
    if(w) wins[w]++;
    if(m.redScore !== '' && !isNaN(Number(m.redScore))) points.red += Number(m.redScore);
    if(m.blueScore !== '' && !isNaN(Number(m.blueScore))) points.blue += Number(m.blueScore);
  });
  return {wins, points};
}

function pairStats(team){
  return state.pairs[team].map((p, idx)=>{
    let w=0, l=0, pf=0, pa=0, played=0;
    state.matches.forEach(m=>{
      const isRed = team==='red' && m.redIdx===idx;
      const isBlue = team==='blue' && m.blueIdx===idx;
      if((!isRed && !isBlue) || m.status !== 'finished') return;
      const winner = matchWinner(m);
      const myScore = isRed ? m.redScore : m.blueScore;
      const oppScore = isRed ? m.blueScore : m.redScore;
      if(myScore !== '' && !isNaN(Number(myScore))) pf += Number(myScore);
      if(oppScore !== '' && !isNaN(Number(oppScore))) pa += Number(oppScore);
      if(winner){
        played++;
        if((isRed && winner==='red') || (isBlue && winner==='blue')) w++;
        else l++;
      }
    });
    const name = pairName(team, idx);
    return {idx, name: name.main, w, l, played, pf, pa};
  }).sort((a,b)=> b.w - a.w || (b.pf-b.pa) - (a.pf-a.pa));
}

/* ---------- PUBLIC VIEW ---------- */
function startAnnouncementScroll(){
  cancelAnimationFrame(announcementAnimationFrame);
  const track = document.querySelector('.sportsmanship-track');
  const container = track ? track.parentElement : null;
  if(!track || !container) return;

  if(!Number.isFinite(announcementPosition) || announcementPosition > container.clientWidth || announcementPosition <= -track.offsetWidth){
    announcementPosition = container.clientWidth;
  }

  const move = ()=>{
    if(!document.body.contains(track)) return;
    announcementPosition -= 1.25;
    if(announcementPosition <= -track.offsetWidth) announcementPosition = container.clientWidth;
    track.style.transform = `translate3d(${announcementPosition}px, -50%, 0)`;
    announcementAnimationFrame = requestAnimationFrame(move);
  };
  move();
}

function renderPublic(){
  const el = document.getElementById('publicView');
  const tally = teamTally();

  const tabBarHtml = `
    <div class="public-tabs">
      <button class="ptab ${publicTab==='overview'?'active':''}" data-tab="overview">ภาพรวม</button>
      <button class="ptab ${publicTab==='teamcheck'?'active':''}" data-tab="teamcheck">เช็คคะแนนรายทีม</button>
    </div>`;

  el.innerHTML = tabBarHtml + `<div id="publicTabBody"></div>`;
  document.querySelectorAll('.ptab').forEach(btn=>{
    btn.addEventListener('click', ()=>{ publicTab = btn.dataset.tab; renderPublic(); });
  });

  const body = document.getElementById('publicTabBody');
  if(publicTab === 'overview'){
    body.innerHTML = renderOverviewHtml(tally);
  } else {
    body.innerHTML = renderTeamCheckHtml();
  }
  startAnnouncementScroll();
}

function renderResultChart(tally){
  const maxWins = Math.max(tally.wins.red, tally.wins.blue, 1);
  const barHeight = wins => `${Math.max((wins / maxWins) * 100, 18)}%`;
  return `
    <div class="result-chart" aria-label="กราฟเปรียบเทียบผลรวมทีม">
      <div class="result-bar-column">
        <div class="result-bar-label red">ทีมสีแดง</div>
        <div class="result-bar-track"><div class="result-bar red" style="height:${barHeight(tally.wins.red)}">${tally.wins.red}</div></div>
      </div>
      <div class="result-bar-column">
        <div class="result-bar-label blue">ทีมสีฟ้า</div>
        <div class="result-bar-track"><div class="result-bar blue" style="height:${barHeight(tally.wins.blue)}">${tally.wins.blue}</div></div>
      </div>
    </div>
  `;
}

function renderCelebration(tally){
  const winner = tally.wins.red === tally.wins.blue ? null : tally.wins.red > tally.wins.blue ? 'red' : 'blue';
  const message = winner ? `${TEAM_LABEL[winner]} ชนะเลิศ` : 'ผลการแข่งขันเสมอกัน';
  const fireworks = ['one','two','three','four','five','six','seven','eight'].map(place => `<span class="firework ${place}"></span>`).join('');
  return `
    <div class="fireworks-overlay" aria-hidden="true">${fireworks}</div>
    <div class="celebration" aria-live="polite">
      <div class="trophy-mark" aria-hidden="true">🏆</div>
      <div class="celebration-copy">${message}</div>
    </div>
  `;
}

function renderOverviewHtml(tally){
  const sorted = [...state.matches].sort((a,b)=>a.order-b.order);

  // queue: live match + next upcoming, at least 5 total
  const liveIdx = sorted.findIndex(m=>m.status==='live');
  let queueList = [];
  if(liveIdx >= 0) queueList.push(sorted[liveIdx]);
  const upcoming = sorted.filter(m=>m.status==='upcoming');
  queueList = queueList.concat(upcoming);
  if(queueList.length < 5){
    const finished = sorted.filter(m=>m.status==='finished').slice(-5);
    queueList = queueList.concat(finished.filter(m=>!queueList.includes(m)));
  }
  queueList = queueList.slice(0,6);

  const queueHtml = queueList.map(m=>{
    const rp = pairName('red', m.redIdx), bp = pairName('blue', m.blueIdx);
    return `<div class="queue-card ${m.status==='live'?'is-live':''}">
      <div class="queue-num"><span>แมทช์ ${m.order}</span>${m.status==='live'?'<span class="badge-live">LIVE</span>':''}</div>
      <div class="queue-teams">
        <div class="queue-team r">คู่ที่ ${m.redIdx+1} สีแดง: ${rp.main}</div>
        <div class="queue-vs">VS</div>
        <div class="queue-team b">คู่ที่ ${m.blueIdx+1} สีฟ้า: ${bp.main}</div>
      </div>
    </div>`;
  }).join('');

  const rowsHtml = sorted.map(m=>{
    const rp = pairName('red', m.redIdx), bp = pairName('blue', m.blueIdx);
    const w = matchWinner(m);
    const statusLabel = {upcoming:'รอแข่ง', live:'กำลังแข่ง', finished:'จบแล้ว'}[m.status];
    let winnerCell = '<span style="color:var(--text-dim);">-</span>';
    if(w === 'red') winnerCell = `<span class="winner-pill red">ทีมแดง</span>`;
    if(w === 'blue') winnerCell = `<span class="winner-pill blue">ทีมฟ้า</span>`;
    return `<tr class="${m.status==='live'?'live-row':''} ${w?'has-winner':''}">
      <td class="mono">${m.order}</td>
      <td class="team-r ${w==='red'?'winner':''}">${rp.main}</td>
      <td class="score-cell">${m.redScore !== '' ? m.redScore : '-'}</td>
      <td class="score-cell">${m.blueScore !== '' ? m.blueScore : '-'}</td>
      <td class="team-b ${w==='blue'?'winner':''}">${bp.main}</td>
      <td><span class="status-pill ${m.status}">${statusLabel}</span></td>
      <td>${winnerCell}</td>
    </tr>`;
  }).join('');

  const resultHtml = state.resultsPublished ? renderCelebration(tally) + renderResultChart(tally) : '<div class="result-hidden">รอแอดมินประกาศผล</div>';
  const sportsMessage = escapeHtml(state.sportsMessage || '');

  return `
    <div class="sportsmanship-card" aria-live="polite">
      <div class="sportsmanship-copy">
        <h3>กระดานประกาศแห่งมิตรภาพ</h3>
        <p><span class="sportsmanship-track"><span class="sportsmanship-text">${sportsMessage}</span></span></p>
      </div>
    </div>
    <div class="section-title" style="margin-top:0;">คะแนนรวมทีม</div>
    ${resultHtml}

    <div class="section-title">ลำดับคู่แข่งขัน</div>
    <div class="queue-row">${queueHtml}</div>

    <div class="section-title">ผลการแข่งขันทั้งหมด</div>
    <div class="table-wrap results-table-wrap">
      <table>
        <thead><tr><th>Match</th><th>ทีมแดง</th><th>คะแนน</th><th>คะแนน</th><th>ทีมฟ้า</th><th>สถานะ</th><th>ผู้ชนะ</th></tr></thead>
        <tbody>${rowsHtml}</tbody>
      </table>
    </div>
  `;
}

function renderTeamCheckHtml(){
  const redStats = pairStats('red');
  const blueStats = pairStats('blue');

  function statTable(list, teamClass){
    const rows = list.map((s, rank)=>`
      <tr>
        <td class="mono" style="color:var(--text-dim);">${rank+1}</td>
        <td class="${teamClass}">${s.name}</td>
        <td class="score-cell">${s.w}</td>
        <td class="score-cell">${s.l}</td>
        <td class="score-cell">${s.pf}-${s.pa}</td>
      </tr>`).join('');
    return `<table>
      <thead><tr><th>#</th><th>คู่</th><th>ชนะ</th><th>แพ้</th><th>คะแนนได้-เสีย</th></tr></thead>
      <tbody>${rows || `<tr><td colspan="5" class="empty-hint">ยังไม่มีข้อมูล</td></tr>`}</tbody>
    </table>`;
  }

  return `
    <div class="section-title" style="margin-top:0;">คะแนนรายคู่ &middot; ทีมสีแดง</div>
    <div class="table-wrap">${statTable(redStats, 'team-r')}</div>

    <div class="section-title">คะแนนรายคู่ &middot; ทีมสีฟ้า</div>
    <div class="table-wrap">${statTable(blueStats, 'team-b')}</div>
  `;
}

      state.pairs[team][idx][field] = e.target.value;
      scheduleSave();
    });
  });
  el.querySelectorAll('.matchInput').forEach(inp=>{

function escapeAttr(s){
  return String(s ?? '').replace(/[&"'<>]/g, char=>({'&':'&amp;','"':'&quot;',"'":'&#39;','<':'&lt;','>':'&gt;'}[char]));
}

function escapeHtml(s){
  return String(s||'').replace(/[&<>]/g, char=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[char]));
}

function switchView(view){
  currentView = view;
  document.getElementById('publicView').style.display = view==='public' ? 'block' : 'none';
  document.getElementById('adminView').style.display = view==='admin' ? 'block' : 'none';
  document.getElementById('btnPublic').classList.toggle('active', view==='public');
  document.getElementById('btnAdmin').classList.toggle('active', view==='admin');
  if(view==='public') renderPublic();
  if(view==='admin') renderAdmin();
}

document.getElementById('btnPublic').addEventListener('click', ()=>switchView('public'));
document.getElementById('btnAdmin').addEventListener('click', async ()=>{
  await firebaseReady;
  if(!firebaseAuth || !authApi){
    alert('ไม่สามารถเชื่อมต่อ Firebase ได้ กรุณารีเฟรชหน้าเว็บแล้วลองใหม่');
    return;
  }
  if(!firebaseAuth.currentUser){
    document.getElementById('loginError').textContent = '';
    document.getElementById('loginForm').reset();
    document.getElementById('loginPanel').hidden = false;
    document.getElementById('adminEmail').focus();
    return;
  }
  switchView('admin');
});
document.getElementById('cancelLogin').addEventListener('click', ()=>{
  document.getElementById('loginPanel').hidden = true;
});
document.getElementById('cancelDelete').addEventListener('click', ()=>{
  pendingDelete = null;
  document.getElementById('deleteConfirm').hidden = true;
});
document.getElementById('confirmDelete').addEventListener('click', async ()=>{
  if(!pendingDelete) return;
  const {type, team, idx} = pendingDelete;
  if(type === 'match'){
    if(state.matches.length > 1) state.matches.splice(idx, 1);
  } else if(state.pairs[team].length > 1){
    state.pairs[team].splice(idx, 1);
    state.matches.forEach(match=>{
      const field = team === 'red' ? 'redIdx' : 'blueIdx';
      if(match[field] === idx) match[field] = 0;
      else if(match[field] > idx) match[field]--;
    });
  }
  scheduleSave();
  pendingDelete = null;
  document.getElementById('deleteConfirm').hidden = true;
  renderAdmin();
});
document.getElementById('loginForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const errorEl = document.getElementById('loginError');
  errorEl.textContent = 'กำลังตรวจสอบ...';
  try{
    await authApi.signInWithEmailAndPassword(firebaseAuth, document.getElementById('adminEmail').value.trim(), document.getElementById('adminPassword').value);
    document.getElementById('loginPanel').hidden = true;
    switchView('admin');
  }catch(error){
    errorEl.textContent = 'เข้าสู่ระบบไม่สำเร็จ กรุณาตรวจสอบอีเมลและรหัสผ่าน';
  }
});
document.querySelector('.brand').addEventListener('click', ()=>{
  publicTab = 'overview';
  switchView('public');
});
document.querySelector('.brand').addEventListener('keydown', (e)=>{
  if(e.key === 'Enter' || e.key === ' '){
    e.preventDefault();
    publicTab = 'overview';
    switchView('public');
  }
});

async function init(){
  await loadState();
  switchView('public');
  pollTimer = setInterval(async ()=>{
    if(currentView === 'public'){
      await loadState();
      renderPublic();
    }
  }, 3000);
}
init();
</script>
